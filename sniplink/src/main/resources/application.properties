spring.application.name=sniplink
server.port=8080

# File-based H2 database: links survive restarts. The file is created in ./data (git-ignored).
spring.datasource.url=jdbc:h2:file:./data/sniplink
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# When deployed, set this to your public address so short links use it, e.g. https://sniplink.onrender.com
# Leave empty locally: the address of the incoming request is used instead.
app.base-url=
